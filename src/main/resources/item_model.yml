# ============================================================
# InvasionCore のアイテムに付ける CustomModelData（カスタムテクスチャ用）
#
# 空白のままなら何も付けない（バニラと同じ見た目）。
# 数字（1, 2, 3 など）を書くと、その数値を CustomModelData として付ける。
#   /give で書くと custom_model_data={floats:[1]} と同じ。よくあるリソースパックはこの形を見る。
# "" で囲んだ文字（"shard" など）を書くと、文字列として付ける（custom_model_data={strings:["shard"]}）。
#
# 付くのは、設定したあとに手に入れたアイテムだけ（前から持っているものは変わらない）。
# 書き換えたら /invasion admin reload で読み直す。
# リソースパックは scripts\build-resourcepack.cmd で作れる（resourcepack/README.md を参照）。
# ============================================================

# ネクサス（ロードストーン）
nexus:
# 強化ハンマー（鉄の斧）
hammer:
# Shard（アメジストの欠片）
shard:
# 応急補修キット（ハニカム）
kit:
# 射撃タレット（ディスペンサー）
turret_arrow:
# 火炎タレット（溶鉱炉）
turret_flame:
# 凍結タレット（氷塊）
turret_frost:
# 修復タレット（ビーコン）
turret_heal:
# スパイクトラップ（鍾乳石）
spike:
# 爆裂地雷（重量感圧板（重））
mine:
# 閃光弾（雪玉）
flash:
# 救急キット（ガストの涙）
medkit:
# 緊急バリア（鉄のトラップドア）
barrier:
# 帰還の羅針盤（回復コンパス）
recall:
# 帰還の羅針盤の詠唱中（チャージ中）だけの見た目。空白なら詠唱中も recall のまま
#   例: recall: 1 / recall_charging: 2 にすると、詠唱を始めた羅針盤が 2 になり、終われば 1 に戻る
#   重ねて持っている羅針盤は、束ごと詠唱中の見た目になる
recall_charging:
