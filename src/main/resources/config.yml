# ============================================================
# InvasionCore 設定
#   侵略MOD（ネクサス防衛） × 7 Days to Die（7日周期・拠点強化）
#
# バランス調整はすべてこのファイルで完結する。
# 変更後は /invasion admin reload で再読み込みできる。
# ============================================================

nexus:
  # ネクサスの基礎HP（Lv1時点）
  base-health: 500.0
  # レベルが1上がるごとの最大HP増加量
  health-per-level: 120.0
  # 防衛範囲（ブロック）。強化ハンマーなどが使える範囲で、境目にパーティクルが出る。
  # ネクサスを置いてからゲーム開始までは、運営（invasioncore.admin）以外はこの範囲から出られない
  defense-radius: 25
  # 侵略者がブロックを破壊してよい半径。範囲外の建築物は絶対に壊されない（防衛範囲以下にする）
  breach-radius: 24
  # 侵略者1撃あたりのネクサスへのダメージ（種別・変異ティアで倍率がかかる）。
  # 各個体は1秒に1回殴るため、実効DPSは「到達した敵の数 x この値」になる。
  # 6.0 だと20体が到達した時点で毎秒120ダメージとなり、防衛線が破られた瞬間に
  # 立て直す時間が一切無くなる（実機検証で確認）。反応できる余地を残す値にしている。
  damage-per-hit: 2.5
  # ネクサスが殴られたときの警告（画面中央の文字・チャット・警告音）を、何秒に1回まで出すか
  attack-warning-seconds: 10
  # 起動後にネクサスの真下を掘って宙に浮かせたとき、地面につなぎ直すまで毎秒減る HP。
  # 浮いたネクサスは侵略者が殴れず、待つだけで勝ててしまうため（真下が空中のままでは起動もできない）
  floating-damage-per-second: 5.0
  # 侵略者の爆発（爆導体の自爆・投擲手の爆弾）がネクサスからこの距離（ブロック）以内で起きると HP が減る。
  # 高い柱の上などで殴られないネクサスにも、爆弾なら届くようにするため
  explosion-radius: 4.0
  # 上の爆発 1 回で減る HP（変異した侵略者は倍率がかかる）
  explosion-damage: 15.0
  # ネクサスレベルの上限
  max-level: 30
  # 稼働中ネクサスの周囲でバニラ敵Mobの自然湧きを止める。
  # 止めないと侵略者と混ざって判別できなくなるため、既定で有効
  suppress-vanilla-spawns: true

mob:
  # 全侵略Mobの移動速度に掛かる係数。種別ごとの相対関係は保たれる。
  # 1.0 でバニラと同じ速さ（侵略者 = ゾンビの 0.9 倍、疾走者 = 1.15 倍 など種別の倍率がかかる）。
  # 速すぎる・遅すぎると感じたら 0.9〜1.1 の範囲で調整する
  speed-multiplier: 1.0
  # 飛行型の速度（ブロック/tick）。経路探索を使わないためここで決まる。
  # 参考: プレイヤーの歩行が約0.215、疾走が約0.28
  flyer-speed: 0.20
  # ダメージを受けた侵略者の頭上に HP を出しておく秒数
  health-display-seconds: 4

breach:
  # AI更新1回あたりの基礎ブロック破壊力
  power-base: 2.5
  # 攻撃力1あたりの追加破壊力
  power-per-damage: 1.5
  # 何回のAI更新で距離が縮まらなければ「閉塞」と判断するか
  stuck-threshold: 3
  # 壁を殴る間隔（tick）。20 = 毎秒1回。
  # この値が無いとAI更新のたびに殴ることになり、破壊力が
  # performance.ai-buckets の設定に左右されてしまう。
  # 小さくすると壁が一瞬で溶けるので注意
  swing-interval-ticks: 20
  # この距離までプレイヤーが近づくと、ネクサスより先にプレイヤーを狙う
  player-aggro-range: 7.0
  # 工兵が積める足場の最大数（登る分と渡る分の合計）
  engineer-max-build-height: 24
  # 工兵が壁の上から内側へ渡す足場の長さの上限（ブロック）
  engineer-max-bridge-length: 6

cycle:
  # 何日ごとに血の月が来るか。7DTD 準拠の既定値は 7
  blood-moon-interval: 7
  # 血の月以外の夜にも小規模襲撃を行うか
  night-skirmish: true
  # 夜間襲撃が始まる日。これより前の夜は襲撃が来ない。
  # 拠点もShardも無い初日から削られると立ち上がりが理不尽になるため猶予を置く。
  # この日より前は叫喚体も湧かず、徘徊ホードは弱いゾンビ（グラント）の少数だけになる
  skirmish-start-day: 3
  # 小規模襲撃の規模（血の月に対する比率）
  night-skirmish-scale: 0.22

wave:
  # 血の月あたりの基礎ウェーブ数
  base-count: 5
  # GameStage 15 ごとに増えるウェーブ数
  count-per-five-stage: 1
  # ウェーブ数の上限
  max-count: 12
  # ウェーブ間隔（tick / 20tick = 1秒）
  interval-ticks: 900
  # 1ウェーブの基礎湧き数
  base-mobs: 6
  # GameStage 1 あたりの追加湧き数
  mobs-per-stage: 0.35
  # 同時に存在できる侵略者の上限。負荷対策なので下げすぎないこと
  max-alive: 90
  # 湧き半径（ネクサスからの距離）。防衛範囲の外から歩いてくるよう、防衛範囲より十分大きくする。
  # 侵攻中は、ここまでのチャンクを読み込んだままにする（湧いた敵が止まらないように）。大きくすると重くなる
  spawn-radius-min: 60
  spawn-radius-max: 100

gamestage:
  # GameStage = (Lv係数 + 日数係数 + プレイヤーLv係数) × 人数補正
  per-nexus-level: 8.0
  per-day: 1.5
  per-player-level: 1.2
  # 人数が増えたときの上乗せ率（sqrt スケール）
  party-bonus: 0.20

heat:
  # ヒートマップ（叫喚体の発生源）を有効にするか
  enabled: true
  per-block-break: 0.6
  per-block-place: 0.3
  per-kill: 1.5
  per-shot: 0.8
  # 毎秒の自然減衰量
  decay-per-second: 0.45
  # この値を超えると叫喚体が湧く
  screamer-threshold: 120.0
  # 同一区画で連続して湧かないようにするクールダウン
  screamer-cooldown-seconds: 180

economy:
  # 侵略者1体あたりの基礎 Shard ドロップ量の基準
  shard-base-drop: 2
  # 修理コスト。missing HP をこの値で割った量の Shard を要求する。
  # 鋼鉄(3200HP)の全損修理が約53 Shard になる想定。小さくすると修理が高騰する
  repair-cost-per-hp: 60
  # 侵略者ではない普通の敵（ゾンビ・スケルトンなど）をプレイヤーが倒したときに落とす Shard の数。0 で落とさない
  vanilla-mob-shard: 1
  # モンスタースポナーから出た敵にも落とさせるか。true にするとトラップタワーで無限に稼げてしまう
  vanilla-mob-shard-from-spawner: false
  # 構造物に最初からあるチェストや樽（村・廃坑・スポナー部屋・神殿・要塞・エンドシティなど）に入れる Shard の数。
  # 初めて開けたときに、中身と一緒にこの範囲で作られる。危ないディメンションほど多い
  loot-chest-shards:
    overworld:
      min: 5
      max: 20
    nether:
      min: 10
      max: 30
    end:
      min: 20
      max: 60

world-events:
  wandering-horde:
    enabled: true
    min-seconds: 600
    max-seconds: 1500
  air-drop:
    enabled: true
    interval-seconds: 1200
    # 補給物資を落とす場所の、ネクサスからの距離（ブロック）
    min-distance: 40
    max-distance: 600
    # 中身の個数の倍率。一番近いと near、一番遠いと far で、その間は距離に比例する（遠いほど多い）
    near-multiplier: 0.3
    far-multiplier: 3.0

daily-reward:
  # 夜明けごとに（1 日生き延びるたびに）、生きている参加者全員へ配る Shard
  shards: 10
  # 何日ごとにパークポイントも配るか（2 なら Day 2・4・6… を生き延びた夜明け）。0 で配らない
  perk-point-every-days: 2
  perk-points: 1

shop:
  # ネクサスの画面の「SHOP」で売る品。上から順に並ぶ（最大 45 品）。
  # item は独自アイテムなら /invasion give と同じ名前、それ以外は Minecraft のアイテム名（IRON_INGOT など）。
  # price は amount 個あたりの値段（Shard）。品を押すと売買の画面で 1 個単位（最大 64 個）で数を選べ、
  # 合計は「個数 ÷ amount × price」を切り上げた値になる。手持ちから払い、足りない分はネクサス内の Shard から払う
  # 売るときは買う値段に sell-ratio を掛けて切り捨てた値で、Shard は手持ちに入る（SHOP に並んでいる品だけ売れる）
  sell-ratio: 0.5
  items:
    # 消耗ガジェット
    - {item: kit, amount: 1, price: 8}
    - {item: flash, amount: 2, price: 6}
    - {item: medkit, amount: 1, price: 8}
    - {item: barrier, amount: 1, price: 20}
    - {item: recall, amount: 1, price: 10}
    # タレットと罠
    - {item: turret_arrow, amount: 1, price: 30}
    - {item: turret_flame, amount: 1, price: 40}
    - {item: turret_frost, amount: 1, price: 40}
    - {item: turret_heal, amount: 1, price: 50}
    - {item: spike, amount: 2, price: 8}
    - {item: mine, amount: 1, price: 12}
    # 弾薬
    - {item: ARROW, amount: 32, price: 4}
    - {item: BLAZE_POWDER, amount: 16, price: 6}
    - {item: SNOWBALL, amount: 16, price: 2}
    - {item: REDSTONE, amount: 32, price: 4}
    # 素材・食べ物
    - {item: IRON_INGOT, amount: 8, price: 6}
    - {item: COBBLESTONE, amount: 64, price: 2}
    - {item: OAK_LOG, amount: 16, price: 3}
    - {item: BREAD, amount: 8, price: 3}
    - {item: COOKED_BEEF, amount: 8, price: 5}

recall:
  # 帰還の羅針盤。右クリックしてからネクサスのそばへ戻るまでの詠唱時間（秒）。動くかダメージを受けると中断する
  cast-seconds: 7
  # ネクサスの画面で買うときの値段（Shard、手持ちから払う）
  price: 10

death:
  # 死んだあと、観戦モードで待つ秒数。終わるとネクサスのそばで生き返る。0 で今までどおりすぐ復活
  spectate-seconds: 10

turret-limit:
  # 拠点全体に置けるタレットの数。最初は base、ネクサスの「砲台増設」1 段ごとに per-level 増え、max で止まる
  base: 5
  per-level: 2
  max: 30

grave:
  # 死んだとき、所持品を死んだ場所の墓（プレイヤーの頭）にまとめる。どこで死んでも作る
  enabled: true
  # 本人しか回収できない時間（秒）。過ぎるとだれでも回収できる。墓は回収されるまで消えない
  owner-only-seconds: 600
  # 他の人が回収しようとしたとき、本人に「許可 / 拒否」を聞いて返事を待つ時間（秒）
  approval-timeout-seconds: 60

guide:
  # ネクサスを光らせる（壁越しにも輪郭が見える）
  nexus-glow: true
  # 防衛範囲（nexus.defense-radius）の外にいるとき、アクションバーにネクサスの方向と距離を出す
  compass: true
  # 防衛範囲の境目からこの距離（ブロック）以内にいると、境目にパーティクルを描く。0 で描かない
  boundary-particles-within: 12

rules:
  # /rule で表示するルール説明の URL。配信ごとに差し替えてよい
  url: "https://luca3yt.github.io/InvasionCore/"

links:
  # /bug（/issues）で表示する、バグ報告・意見のフォームの URL
  issues-url: "https://github.com/Luca3YT/InvasionCore/issues/new/choose"
  # /bug（/issues）で一緒に表示する、送られた報告の一覧の URL
  issues-list-url: "https://github.com/Luca3YT/InvasionCore/issues"
  # /patchnote（/patchnotes）で表示する、最新のパッチノートの URL
  patch-notes-url: "https://github.com/Luca3YT/InvasionCore/releases/latest"

web:
  # 管理画面と OBS オーバーレイを配信する Web サーバー
  enabled: true
  # 待ち受けるポート。VPS やホスティングパネル（Pelican など）では、割り当てられた追加ポートを書く。
  # Minecraft 本体のポート（server-port）とは別の番号にすること。変えたらサーバーの再起動が必要
  port: 8765
  # 待ち受けるアドレス。0.0.0.0 で外部（インターネットや同じ Wi-Fi）から開ける。この PC だけにするなら 127.0.0.1
  bind: "0.0.0.0"
  # 外から見たこのサーバーのアドレス。/invasion admin web で表示する URL に使う。
  # VPS なら "http://<サーバーのIPかドメイン>:<上の port>" のように書く（末尾の / は不要）。
  # 空欄なら、このマシンの LAN の IP と localhost で表示する（自宅で動かすとき向け）
  public-url: ""
  # true にすると OBS オーバーレイにもパスワードが必要になる（URL に token が付く）。
  # オーバーレイに出るのは名前と Shard の数だけなので、既定ではパスワードなし
  overlay-token: false
  # オーバーレイの表示パターン（b: ポートレート / c: トースト / e: ビッグナンバー / f: バナー）。
  # 管理画面からも切り替えられる
  overlay-style: "b"

performance:
  # 侵略MobのAIを何tickに分散させるか。大きいほど軽いが反応が鈍る
  ai-buckets: 4
  # タレットの処理間隔（tick）
  turret-tick-interval: 10
  # 侵攻中にネクサス周辺のチャンクを保持するか
  keep-chunks-loaded: true
