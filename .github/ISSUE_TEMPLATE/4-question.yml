name: 質問
description: 遊び方やルールがわからないときはこちら
title: "[質問] "
labels: ["質問", "状態: 確認待ち"]
body:
  - type: markdown
    attributes:
      value: |
        フォームを選ぶ画面の下にある「参加者ガイド」「遊び方ガイド」を先に見ると、すぐ解決するかもしれません。
        それでもわからなければ、気軽に聞いてください。
        **ここに書いた内容は誰でも見られます。** 個人情報は書かないでください。
  - type: textarea
    id: question
    attributes:
      label: 何がわかりませんか？
      placeholder: 例）強化ハンマーで右クリックしても何も起きない。どうすれば壁を強化できる？
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 試したこと
      description: 試したことがあれば書いてください。
